name: Deploy MAC Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Make asset URLs GitHub Pages-safe
        run: |
          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 | xargs -0 -r sed -i \
            -e 's#/_next/#/mac-studio-website/_next/#g' \
            -e 's#/videos/#/mac-studio-website/videos/#g' \
            -e 's#/og.png#/mac-studio-website/og.png#g'
          touch dist/client/.nojekyll
          test -f dist/client/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
