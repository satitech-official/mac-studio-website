name: Deploy MAC Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build static GitHub Pages site
        run: npx vite build --config vite.pages.config.ts

      - name: Verify Pages output
        run: |
          test -f dist/pages/github-pages/index.html
          cp dist/pages/github-pages/index.html dist/pages/index.html
          rm -rf dist/pages/github-pages
          touch dist/pages/.nojekyll
          test -f dist/pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
